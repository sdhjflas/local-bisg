<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISG Label Generator - Local</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #1e293b;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            height: 18px;
            width: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-success {
            background: #d1fae5;
            border: 1px solid #10b981;
            color: #065f46;
        }

        .alert-error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
        }

        .downloads {
            margin-top: 1rem;
        }

        .download-link {
            display: block;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
            transition: background 0.2s;
        }

        .download-link:hover {
            background: #e2e8f0;
        }

        .section-title {
            font-size: 1.2rem;
            color: #1e293b;
            font-weight: 600;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .help-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 24px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏷️ BISG Label Generator</h1>
        <p class="subtitle">Generate BISG-compliant book and carton labels locally</p>

        <div id="alert" class="alert"></div>

        <form id="labelForm">
            <!-- Book Information -->
            <div class="section-title">Book Information</div>

            <div class="form-group">
                <label for="title">Book Title *</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="author">Author *</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="form-group">
                    <label for="publisher">Publisher *</label>
                    <input type="text" id="publisher" name="publisher" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="isbn">ISBN-13 *</label>
                    <input type="text" id="isbn" name="isbn" placeholder="9780985347024" required maxlength="13" pattern="\d{13}">
                    <div class="help-text">13 digits only</div>
                </div>
                <div class="form-group">
                    <label for="pub_date">Publication Date</label>
                    <input type="text" id="pub_date" name="pub_date" placeholder="01/15/2025">
                </div>
            </div>

            <!-- Pricing Information -->
            <div class="section-title">Pricing Information</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price *</label>
                    <input type="text" id="price" name="price" placeholder="24.99" required>
                </div>
                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency" name="currency">
                        <option value="USD" selected>USD ($)</option>
                        <option value="CAD">CAD (C$)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="AUD">AUD (A$)</option>
                        <option value="NZD">NZD (NZ$)</option>
                    </select>
                </div>
            </div>

            <!-- Carton Information -->
            <div class="section-title">Carton Information</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="carton_qty">Books per Carton</label>
                    <input type="number" id="carton_qty" name="carton_qty" value="10" min="1">
                </div>
                <div class="form-group">
                    <label for="carton_weight">Carton Weight (lbs)</label>
                    <input type="number" id="carton_weight" name="carton_weight" value="25" min="0" step="0.1">
                </div>
            </div>

            <div class="form-group">
                <label for="country">Country of Origin</label>
                <input type="text" id="country" name="country" value="USA">
            </div>

            <!-- Label Options -->
            <div class="section-title">Label Options</div>

            <div class="form-group">
                <label for="label_type">Label Type *</label>
                <select id="label_type" name="label_type">
                    <option value="both" selected>Both (Book + Carton)</option>
                    <option value="book">Book Label Only</option>
                    <option value="carton">Carton Label Only</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="book_format">Book Label Format</label>
                    <select id="book_format" name="book_format">
                        <option value="both" selected>Both (Single + Sheet of 30)</option>
                        <option value="single">Single Label Only</option>
                        <option value="sheet">Sheet of 30 Only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="carton_format">Carton Label Format</label>
                    <select id="carton_format" name="carton_format">
                        <option value="both" selected>Both (Single + Two-up)</option>
                        <option value="single">Single Label Only</option>
                        <option value="twoup">Two-up Only</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="is_custom_upc" name="is_custom_upc">
                    <label for="is_custom_upc">Use custom alphanumeric UPC (Code 128)</label>
                </div>
                <div class="help-text">Check this if your ISBN contains letters (e.g., "123456HAT")</div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                Generate Labels
            </button>
        </form>

        <div id="downloads" class="downloads"></div>
    </div>

    <script>
        const form = document.getElementById('labelForm');
        const submitBtn = document.getElementById('submitBtn');
        const alert = document.getElementById('alert');
        const downloads = document.getElementById('downloads');

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
        }

        function hideAlert() {
            alert.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            downloads.innerHTML = '';

            // Get form data
            const formData = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                publisher: document.getElementById('publisher').value,
                isbn: document.getElementById('isbn').value,
                price: document.getElementById('price').value,
                currency: document.getElementById('currency').value,
                pub_date: document.getElementById('pub_date').value,
                carton_qty: document.getElementById('carton_qty').value,
                carton_weight: document.getElementById('carton_weight').value,
                country: document.getElementById('country').value,
                label_type: document.getElementById('label_type').value,
                book_format: document.getElementById('book_format').value,
                carton_format: document.getElementById('carton_format').value,
                is_custom_upc: document.getElementById('is_custom_upc').checked
            };

            // Validate ISBN
            if (!/^\d{13}$/.test(formData.isbn) && !formData.is_custom_upc) {
                showAlert('ISBN must be exactly 13 digits', 'error');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Generating...';

            try {
                const response = await fetch('/generate-labels', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert('Labels generated successfully! Click below to download:', 'success');

                    // Show download links
                    let downloadHtml = '<div class="section-title">Download Your Labels</div>';

                    for (const [labelName, fileInfo] of Object.entries(result.files)) {
                        const displayName = labelName
                            .replace(/_/g, ' ')
                            .replace(/\b\w/g, l => l.toUpperCase());

                        downloadHtml += `
                            <a href="${fileInfo.download_url}" class="download-link" download="${fileInfo.filename}">
                                📥 ${displayName} - ${fileInfo.filename}
                            </a>
                        `;
                    }

                    downloads.innerHTML = downloadHtml;

                } else {
                    showAlert(`Error: ${result.error || 'Failed to generate labels'}`, 'error');
                }

            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Labels';
            }
        });

        // Auto-format ISBN input
        document.getElementById('isbn').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').substring(0, 13);
        });
    </script>
</body>
</html>
