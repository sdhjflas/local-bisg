    <!-- Barcode lines -->
    <rect x="20" y="60" width="3" height="25" fill="#1e293b"/>
    <rect x="28" y="60" width="2" height="25" fill="#1e293b"/>
    <rect x="34" y="60" width="4" height="25" fill="#1e293b"/>
    <rect x="42" y="60" width="2" height="25" fill="#1e293b"/>
    <rect x="48" y="60" width="3" height="25" fill="#1e293b"/>
    <rect x="55" y="60" width="2" height="25" fill="#1e293b"/>
    <rect x="61" y="60" width="4" height="25" fill="#1e293b"/>
    <rect x="69" y="60" width="2" height="25" fill="#1e293b"/>
    <rect x="75" y="60" width="3" height="25" fill="#1e293b"/>
    <rect x="82" y="60" width="4" height="25" fill="#1e293b"/>
    <rect x="90" y="60" width="2" height="25" fill="#1e293b"/>
    <rect x="96" y="60" width="3" height="25" fill="#1e293b"/>
