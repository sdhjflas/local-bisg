    <text x="80" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">ISBN</text>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">9780000000000</text>
  </g>

  <!-- Price tag corner -->
  <circle cx="200" cy="80" r="24" fill="#f59e0b"/>
  <text x="200" y="88" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">$</text>
